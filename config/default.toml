schema_version = 1

[paths]
project_root = ".."
source_manifest = "data/manifest.json"
corpus_lock = "data/corpus.lock.json"
pdf_directory = "data/pdfs"
metadata_directory = "data/downloads"
extracted_pages_directory = "artifacts/extracted"
chunks_directory = "artifacts/chunks"
embedding_model_directory = "models/multilingual-e5-small"
reranker_model_directory = "models/mmarco-mMiniLMv2-L12-H384-v1"
generator_model_file = "models/qwen2.5-1.5b-instruct-gguf/qwen2.5-1.5b-instruct-q4_k_m.gguf"
llama_server_executable = "runtime/llama-b10621/bin/llama-server.exe"
qdrant_directory = "indexes/qdrant"
evaluation_candidates = "evaluation/candidates.jsonl"
evaluation_review = "evaluation/review.csv"
evaluation_silver = "evaluation/silver.jsonl"
evaluation_silver_audit = "evaluation/silver_audit.csv"
evaluation_gold = "evaluation/gold.jsonl"
evaluation_results_directory = "evaluation/results"

[downloader]
timeout_seconds = 30
chunk_size_bytes = 65536
maximum_pdf_bytes = 52428800
user_agent = "turkish-local-rag-benchmark/0.1"

[extraction]
sort_blocks = true
include_empty_pages = false

[chunking]
target_model_tokens = 384
maximum_model_tokens = 448
overlap_model_tokens = 48
estimated_characters_per_token = 3
respect_page_boundaries = true
preserve_article_boundaries = true

[retrieval.rrf]
rank_constant = 60
dense_candidates = 50
sparse_candidates = 50
fused_candidates = 20

[retrieval.bm25]
k1 = 1.5
b = 0.75
epsilon = 0.25
minimum_score = 0.0
top_k = 20

[retrieval.dense]
model_id = "intfloat/multilingual-e5-small"
model_revision = "614241f622f53c4eeff9890bdc4f31cfecc418b3"
model_sha256 = "1a55775f53449dac10a2bcbc312469fac40b96d53198c407081a831f81c98477"
vector_size = 384
max_sequence_length = 512
batch_size = 8
query_prefix = "query: "
passage_prefix = "passage: "
normalize_embeddings = true
collection_name = "chunks_e5_small_v1"
minimum_score = 0.0

[retrieval.reranker]
model_id = "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
model_revision = "1427fd652930e4ba29e8149678df786c240d8825"
model_sha256 = "5daeca2481a76b5976a2bdc32f0a78532b6716da4f8cd3ff59460ef8d2f359b4"
max_sequence_length = 512
batch_size = 4
rerank_top_n = 20
top_k = 10
cpu_threads = 4
zero_shot_turkish = true

[generation]
backend = "llama.cpp-server"
model_id = "Qwen/Qwen2.5-1.5B-Instruct-GGUF"
model_revision = "91cad51170dc346986eccefdc2dd33a9da36ead9"
model_sha256 = "6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e"
